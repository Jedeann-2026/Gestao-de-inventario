<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexxa Scanner - Leitura Detalhada de Estoque</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leitor de Código de Barras via Câmera -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        #reader video {
            object-fit: cover !important;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-amber-500/10 p-2 rounded-lg border border-amber-500/20">
                    <i class="fa-solid fa-barcode text-amber-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-amber-400">NEXXA Scanner</h1>
                    <p class="text-[10px] text-slate-400">Estoque por Cliente & CD</p>
                </div>
            </div>
            <button id="btn-config" class="text-slate-400 hover:text-white p-2 rounded-lg transition" title="Configurações Supabase">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">

        <!-- Card da Câmera -->
        <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800 shadow-xl">
            <div id="reader-container" class="relative">
                <div id="reader" class="w-full bg-black rounded-xl overflow-hidden min-h-[220px] flex items-center justify-center">
                    <div id="camera-placeholder" class="text-center p-6 text-slate-500">
                        <i class="fa-solid fa-camera text-4xl mb-2 text-slate-600"></i>
                        <p class="text-xs text-slate-400">Clique abaixo para ativar a câmera</p>
                    </div>
                </div>
            </div>

            <!-- Botão de Ação -->
            <div class="mt-4">
                <button id="btn-scan" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg transition">
                    <i class="fa-solid fa-camera"></i>
                    <span id="scan-btn-text">Escanear Código de Barras</span>
                </button>
            </div>
        </div>

        <!-- Busca Manual -->
        <div class="bg-slate-900 rounded-2xl p-3 border border-slate-800">
            <form id="form-manual" class="flex gap-2">
                <input type="text" id="input-search" placeholder="Digitar EAN ou nome do produto..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
                <button type="submit" class="bg-slate-800 hover:bg-slate-700 text-amber-400 px-4 py-2 rounded-xl font-medium text-xs transition border border-slate-700">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
        </div>

        <!-- Feedback / Status -->
        <div id="status-alert" class="hidden p-3 rounded-xl text-xs text-center font-medium"></div>

        <!-- Card de Resultado do Produto -->
        <div id="result-card" class="hidden bg-slate-900 rounded-2xl p-4 border border-slate-800 shadow-xl space-y-4">
            
            <!-- Cabeçalho do Produto -->
            <div class="border-b border-slate-800 pb-3 flex justify-between items-start gap-2">
                <div>
                    <span id="res-code" class="text-[10px] font-mono bg-slate-800 text-amber-400 px-2 py-1 rounded border border-slate-700">--</span>
                    <h2 id="res-desc" class="text-base font-bold text-white mt-2 leading-tight">--</h2>
                    <span id="res-cat" class="inline-block mt-1 text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">GERAL</span>
                </div>
            </div>

            <!-- Resumo Geral (Totais + Preço) -->
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <span class="text-[10px] text-slate-400 block mb-0.5">Preço Unit.</span>
                    <span id="res-price" class="text-sm font-bold text-emerald-400">R$ 0,00</span>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <span class="text-[10px] text-slate-400 block mb-0.5">Estoque CD</span>
                    <span id="res-stock-cd" class="text-sm font-bold text-blue-400">0</span>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <span class="text-[10px] text-slate-400 block mb-0.5">Est. Total</span>
                    <span id="res-stock-total" class="text-sm font-bold text-white">0</span>
                </div>
            </div>

            <!-- Tabela Detalhada por Cliente / Loja -->
            <div class="space-y-2">
                <h3 class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-store"></i> Estoque por Cliente / Loja
                </h3>
                <div class="overflow-x-auto rounded-xl border border-slate-800 max-h-60 overflow-y-auto">
                    <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
                        <thead>
                            <tr class="bg-slate-950 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800 sticky top-0">
                                <th class="p-2.5 font-semibold">Cliente / Loja</th>
                                <th class="p-2.5 font-semibold text-center text-emerald-400">Est. Loja</th>
                                <th class="p-2.5 font-semibold text-center text-blue-400">Est. CD</th>
                            </tr>
                        </thead>
                        <tbody id="client-stock-table-body" class="divide-y divide-slate-800 text-slate-200">
                            <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <!-- Modal de Configuração -->
    <div id="modal-config" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
            <h3 class="text-base font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-database text-amber-400"></i> Configuração Supabase
            </h3>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="font-semibold text-slate-300 block mb-1">URL Supabase</label>
                    <input type="text" id="cfg-url" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="font-semibold text-slate-300 block mb-1">Anon Key (Chave Pública)</label>
                    <input type="password" id="cfg-key" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-amber-400">
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button id="btn-save-cfg" class="flex-1 bg-amber-400 hover:bg-amber-500 text-slate-950 font-bold py-2 rounded-xl text-xs transition">Salvar</button>
                <button id="btn-close-cfg" class="bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 px-4 rounded-xl text-xs transition">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_URL = "https://mjkqkyuolsqhtxwzivof.supabase.co";
        const DEFAULT_KEY = "SUA_ANON_KEY_AQUI"; // Coloque a sua chave pública aqui

        let supabaseUrl = localStorage.getItem('nexxa_sb_url') || DEFAULT_URL;
        let supabaseKey = localStorage.getItem('nexxa_sb_key') || DEFAULT_KEY;
        let supabaseClient = null;

        let html5QrCode = null;
        let isScanning = false;

        const btnScan = document.getElementById('btn-scan');
        const scanBtnText = document.getElementById('scan-btn-text');
        const btnConfig = document.getElementById('btn-config');
        const modalConfig = document.getElementById('modal-config');
        const btnSaveCfg = document.getElementById('btn-save-cfg');
        const btnCloseCfg = document.getElementById('btn-close-cfg');
        const formManual = document.getElementById('form-manual');
        const inputSearch = document.getElementById('input-search');
        const resultCard = document.getElementById('result-card');
        const statusAlert = document.getElementById('status-alert');

        function initSupabase() {
            if (supabaseUrl && supabaseKey && supabaseKey !== 'SUA_ANON_KEY_AQUI') {
                try {
                    supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
                    showAlert('Base Nexxa conectada com sucesso!', 'success');
                    setTimeout(hideAlert, 2000);
                } catch (e) {
                    showAlert('Erro ao conectar ao Supabase.', 'error');
                }
            } else {
                showAlert('Configure a Anon Key nas configurações (⚙).', 'warning');
            }
        }

        btnScan.addEventListener('click', () => {
            if (isScanning) stopScanner();
            else startScanner();
        });

        function startScanner() {
            document.getElementById('camera-placeholder').classList.add('hidden');
            html5QrCode = new Html5Qrcode("reader");

            const config = { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                async (decodedText) => {
                    stopScanner();
                    buscarProdutoBaseNexxa(decodedText.trim());
                },
                (errorMessage) => {}
            ).then(() => {
                isScanning = true;
                scanBtnText.innerText = "Parar Câmera";
                btnScan.classList.replace('bg-amber-500', 'bg-rose-600');
                btnScan.classList.replace('hover:bg-amber-600', 'hover:bg-rose-700');
                btnScan.classList.replace('text-slate-950', 'text-white');
            }).catch(err => {
                showAlert("Erro ao acessar a câmera: " + err, "error");
                document.getElementById('camera-placeholder').classList.remove('hidden');
            });
        }

        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    isScanning = false;
                    scanBtnText.innerText = "Escanear Código de Barras";
                    btnScan.classList.replace('bg-rose-600', 'bg-amber-500');
                    btnScan.classList.replace('hover:bg-rose-700', 'hover:bg-amber-600');
                    btnScan.classList.replace('text-white', 'text-slate-950');
                });
            }
        }

        async function buscarProdutoBaseNexxa(termo) {
            if (!termo) return;
            if (!supabaseClient) {
                showAlert('Configure as credenciais do Supabase.', 'warning');
                return;
            }

            showAlert(`Buscando "${termo}" em todos os clientes...`, 'info');

            try {
                const { data: cloudData, error } = await supabaseClient.from('nexxa_store').select('*');
                if (error) throw error;

                if (!cloudData || cloudData.length === 0) {
                    showAlert('Nenhum registro encontrado na base nexxa_store.', 'error');
                    return;
                }

                const termoUpper = termo.toUpperCase();
                let produtoInfo = null;
                let clientStockMap = {};
                let estoqueCdTotal = 0;
                let precoVenda = 0;

                // 1. PROCESSAR DADOS DE ESTOQUE (Agrupando por cliente e CD)
                const registroEstoque = cloudData.find(d => d.id === 'estoque' || d.id === 'ESTOQUE');
                if (registroEstoque && registroEstoque.data) {
                    const estoqueObj = registroEstoque.data;

                    for (let key in estoqueObj) {
                        const item = estoqueObj[key];
                        const cleanEan = item.ean ? String(item.ean).trim() : '';
                        const cleanName = item.produto ? String(item.produto).trim().toUpperCase() : '';

                        if ((cleanEan && cleanEan === termo) || (cleanName && cleanName.includes(termoUpper))) {
                            if (!produtoInfo) {
                                produtoInfo = {
                                    codigo: item.ean || 'S/EAN',
                                    descricao: item.produto,
                                    categoria: item.categoria || 'GERAL'
                                };
                            }

                            const clienteNome = (item.cliente || 'Geral').trim();
                            const qtdEstoque = Number(item.estoque) || 0;

                            // Verifica se é o CD
                            if (clienteNome.toUpperCase().startsWith('CD')) {
                                estoqueCdTotal += qtdEstoque;
                            } else {
                                clientStockMap[clienteNome] = (clientStockMap[clienteNome] || 0) + qtdEstoque;
                            }
                        }
                    }
                }

                // 2. PROCESSAR DADOS DE VENDAS (Para extrair o preço praticado)
                const registroVendas = cloudData.find(d => d.id === 'vendas');
                if (registroVendas && registroVendas.data && Array.isArray(registroVendas.data)) {
                    const vendasArr = registroVendas.data;
                    const vendaItem = vendasArr.find(v => 
                        (v.ean && String(v.ean).trim() === termo) || 
                        (v.produto && String(v.produto).trim().toUpperCase().includes(termoUpper))
                    );

                    if (vendaItem) {
                        precoVenda = vendaItem.vlrUnit || 0;
                        if (!produtoInfo) {
                            produtoInfo = {
                                codigo: vendaItem.ean || 'S/EAN',
                                descricao: vendaItem.produto,
                                categoria: vendaItem.categoria || 'GERAL'
                            };
                        }
                    }
                }

                if (produtoInfo) {
                    exibirResultadoDetalhado(produtoInfo, clientStockMap, estoqueCdTotal, precoVenda);
                    hideAlert();
                } else {
                    resultCard.classList.add('hidden');
                    showAlert(`Produto não encontrado na base: "${termo}"`, 'error');
                }

            } catch (err) {
                console.error("Erro na consulta:", err);
                showAlert(`Erro ao consultar o banco: ${err.message}`, 'error');
            }
        }

        function exibirResultadoDetalhado(info, clientStockMap, estoqueCd, preco) {
            document.getElementById('res-code').innerText = info.codigo || 'S/EAN';
            document.getElementById('res-desc').innerText = info.descricao || 'Sem Descrição';
            document.getElementById('res-cat').innerText = info.categoria || 'GERAL';
            
            document.getElementById('res-price').innerText = parseFloat(preco).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('res-stock-cd').innerText = estoqueCd;

            // Renderizar Tabela de Clientes
            const tbody = document.getElementById('client-stock-table-body');
            tbody.innerHTML = '';

            let estoqueLojasTotal = 0;
            const clientesList = Object.keys(clientStockMap).sort();

            if (clientesList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-3 text-center text-slate-500">Nenhum estoque em lojas encontrado.</td></tr>`;
            } else {
                clientesList.forEach(cliente => {
                    const qtd = clientStockMap[cliente];
                    estoqueLojasTotal += qtd;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-800/50 transition-colors";
                    tr.innerHTML = `
                        <td class="p-2.5 font-semibold text-slate-100 flex items-center gap-1.5">
                            <i class="fa-solid fa-store text-amber-400 text-[10px]"></i> ${cliente}
                        </td>
                        <td class="p-2.5 text-center font-bold text-emerald-400">${qtd}</td>
                        <td class="p-2.5 text-center font-bold text-blue-400">${estoqueCd}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Calcular Estoque Total Consolidado
            document.getElementById('res-stock-total').innerText = estoqueLojasTotal + estoqueCd;

            resultCard.classList.remove('hidden');
        }

        formManual.addEventListener('submit', (e) => {
            e.preventDefault();
            const termo = inputSearch.value.trim();
            if (termo) buscarProdutoBaseNexxa(termo);
        });

        function showAlert(msg, type) {
            statusAlert.innerText = msg;
            statusAlert.className = "p-3 rounded-xl text-xs text-center font-medium border ";
            if (type === 'error') statusAlert.classList.add('bg-rose-950/60', 'border-rose-800', 'text-rose-300');
            else if (type === 'warning') statusAlert.classList.add('bg-amber-950/60', 'border-amber-800', 'text-amber-300');
            else if (type === 'success') statusAlert.classList.add('bg-emerald-950/60', 'border-emerald-800', 'text-emerald-300');
            else statusAlert.classList.add('bg-slate-900', 'border-slate-800', 'text-amber-400');
            statusAlert.classList.remove('hidden');
        }

        function hideAlert() {
            statusAlert.classList.add('hidden');
        }

        btnConfig.addEventListener('click', () => {
            document.getElementById('cfg-url').value = supabaseUrl;
            document.getElementById('cfg-key').value = supabaseKey;
            modalConfig.classList.remove('hidden');
        });

        btnCloseCfg.addEventListener('click', () => modalConfig.classList.add('hidden'));

        btnSaveCfg.addEventListener('click', () => {
            supabaseUrl = document.getElementById('cfg-url').value.trim();
            supabaseKey = document.getElementById('cfg-key').value.trim();

            localStorage.setItem('nexxa_sb_url', supabaseUrl);
            localStorage.setItem('nexxa_sb_key', supabaseKey);

            modalConfig.classList.add('hidden');
            initSupabase();
        });

        window.addEventListener('DOMContentLoaded', () => {
            initSupabase();
        });
    </script>
</body>
</html>
