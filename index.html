<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consulta Nexxa - Leitor de Código de Barras</title>
    <!-- Tailwind CSS para interface responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leitor de Código de Barras via Câmera -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        #reader video {
            object-fit: cover !important;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-barcode text-blue-500 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide text-white">Nexxa Scanner</h1>
            </div>
            <button id="btn-config" class="text-gray-400 hover:text-white p-2 rounded-lg transition" title="Configurações Supabase">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">

        <!-- Card da Câmera -->
        <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 shadow-xl">
            <div id="reader-container" class="relative">
                <div id="reader" class="w-full bg-black rounded-lg overflow-hidden min-h-[220px] flex items-center justify-center">
                    <div id="camera-placeholder" class="text-center p-6 text-gray-500">
                        <i class="fa-solid fa-camera text-4xl mb-2"></i>
                        <p class="text-sm">Clique no botão abaixo para ativar a câmera</p>
                    </div>
                </div>
            </div>

            <!-- Botões de Ação da Câmera -->
            <div class="mt-4 flex gap-2">
                <button id="btn-scan" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2 shadow-lg transition">
                    <i class="fa-solid fa-camera"></i>
                    <span id="scan-btn-text">Escanear Produto</span>
                </button>
                <button id="btn-torch" class="hidden bg-gray-700 hover:bg-gray-600 text-yellow-400 p-3 rounded-lg transition" title="Alternar Lanterna">
                    <i class="fa-solid fa-lightbulb"></i>
                </button>
            </div>
        </div>

        <!-- Busca Manual -->
        <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
            <form id="form-manual" class="flex gap-2">
                <input type="text" id="input-search" placeholder="Digitar código de barras ou nome..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                <button type="submit" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-medium text-sm transition">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
        </div>

        <!-- Feedback de Erro / Alertas -->
        <div id="status-alert" class="hidden p-3 rounded-lg text-sm text-center font-medium"></div>

        <!-- Card de Resultado do Produto -->
        <div id="result-card" class="hidden bg-gray-800 rounded-xl p-5 border border-gray-700 shadow-xl space-y-4">
            <div class="border-b border-gray-700 pb-3 flex justify-between items-start">
                <div>
                    <span id="res-code" class="text-xs font-mono bg-gray-700 text-blue-400 px-2 py-1 rounded">--</span>
                    <h2 id="res-desc" class="text-lg font-bold text-white mt-2 leading-tight">--</h2>
                </div>
                <span class="bg-blue-900/50 text-blue-300 text-xs px-2 py-1 rounded border border-blue-800 font-semibold">Base Nexxa</span>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-gray-900/60 p-3 rounded-lg border border-gray-700/50">
                    <span class="text-xs text-gray-400 block mb-1">Preço de Venda</span>
                    <span id="res-price" class="text-xl font-bold text-emerald-400">R$ 0,00</span>
                </div>
                <div class="bg-gray-900/60 p-3 rounded-lg border border-gray-700/50">
                    <span class="text-xs text-gray-400 block mb-1">Estoque Atual</span>
                    <span id="res-stock" class="text-xl font-bold text-white">0</span>
                </div>
            </div>

            <div class="bg-gray-900/40 p-3 rounded-lg border border-gray-700/30 flex justify-between items-center text-sm">
                <span class="text-gray-400"><i class="fa-solid fa-user text-xs mr-1"></i> Cliente / Ref:</span>
                <span id="res-client" class="text-gray-200 font-medium">--</span>
            </div>
        </div>

    </main>

    <!-- Modal de Configuração do Supabase -->
    <div id="modal-config" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gray-800 border border-gray-700 rounded-xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-database text-blue-500"></i> Conexão Supabase
            </h3>
            <p class="text-xs text-gray-400">Insira suas credenciais para consultar a tabela <code class="bg-gray-900 px-1 py-0.5 rounded text-blue-300">nexxa_store</code>.</p>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-gray-300 block mb-1">Supabase URL</label>
                    <input type="text" id="cfg-url" placeholder="https://xyz.supabase.co" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-300 block mb-1">Anon Key (Pública)</label>
                    <input type="password" id="cfg-key" placeholder="eyJh..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-300 block mb-1">Nome da Coluna do Código</label>
                    <input type="text" id="cfg-col" value="codigo_barras" placeholder="codigo_barras" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button id="btn-save-cfg" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded-lg text-sm transition">Salvar Conexão</button>
                <button id="btn-close-cfg" class="bg-gray-700 hover:bg-gray-600 text-gray-300 py-2 px-4 rounded-lg text-sm transition">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Script da Aplicação -->
    <script>
        // Configurações Padrão
        let supabaseUrl = localStorage.getItem('nexxa_sb_url') || '';
        let supabaseKey = localStorage.getItem('nexxa_sb_key') || '';
        let barcodeCol  = localStorage.getItem('nexxa_sb_col') || 'codigo_barras';
        let supabaseClient = null;

        let html5QrCode = null;
        let isScanning = false;

        // Elementos DOM
        const btnScan = document.getElementById('btn-scan');
        const scanBtnText = document.getElementById('scan-btn-text');
        const btnConfig = document.getElementById('btn-config');
        const modalConfig = document.getElementById('modal-config');
        const btnSaveCfg = document.getElementById('btn-save-cfg');
        const btnCloseCfg = document.getElementById('btn-close-cfg');
        const formManual = document.getElementById('form-manual');
        const inputSearch = document.getElementById('input-search');
        const resultCard = document.getElementById('result-card');
        const statusAlert = document.getElementById('status-alert');

        // Inicializa Cliente Supabase
        function initSupabase() {
            if (supabaseUrl && supabaseKey) {
                try {
                    supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
                    showAlert('Conectado ao Supabase com sucesso!', 'success');
                } catch (e) {
                    showAlert('Erro ao inicializar Supabase. Verifique a URL/Key.', 'error');
                }
            } else {
                showAlert('Configure sua URL e Anon Key do Supabase no ícone de engrenagem.', 'warning');
            }
        }

        // Toggle Câmera
        btnScan.addEventListener('click', () => {
            if (isScanning) {
                stopScanner();
            } else {
                startScanner();
            }
        });

        function startScanner() {
            document.getElementById('camera-placeholder').classList.add('hidden');
            html5QrCode = new Html5Qrcode("reader");

            const config = { 
                fps: 10, 
                qrbox: { width: 250, height: 150 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" }, // Câmera Traseira
                config,
                async (decodedText) => {
                    // Código Lido com Sucesso
                    stopScanner();
                    buscarProduto(decodedText.trim());
                },
                (errorMessage) => {
                    // Erros contínuos de leitura (podem ser ignorados)
                }
            ).then(() => {
                isScanning = true;
                scanBtnText.innerText = "Parar Câmera";
                btnScan.classList.replace('bg-blue-600', 'bg-red-600');
                btnScan.classList.replace('hover:bg-blue-500', 'hover:bg-red-500');
            }).catch(err => {
                showAlert("Erro ao acessar a câmera: " + err, "error");
                document.getElementById('camera-placeholder').classList.remove('hidden');
            });
        }

        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    isScanning = false;
                    scanBtnText.innerText = "Escanear Produto";
                    btnScan.classList.replace('bg-red-600', 'bg-blue-600');
                    btnScan.classList.replace('hover:bg-red-500', 'hover:bg-blue-500');
                });
            }
        }

        // Busca de Produtos (Supabase)
        async function buscarProduto(termo) {
            if (!termo) return;

            if (!supabaseClient) {
                showAlert('Por favor, configure as chaves do Supabase primeiro.', 'warning');
                return;
            }

            showAlert(`Consultando "${termo}" na base...`, 'info');

            try {
                // Tenta consultar por código de barras primeiro
                let query = supabaseClient
                    .from('nexxa_store')
                    .select('*')
                    .eq(barcodeCol, termo);

                let { data, error } = await query;

                // Se não achou pelo código exato, tenta buscar por descrição (LIKE)
                if ((!data || data.length === 0) && isNaN(termo)) {
                    let descQuery = await supabaseClient
                        .from('nexxa_store')
                        .select('*')
                        .ilike('descricao', `%${termo}%`)
                        .limit(1);
                    data = descQuery.data;
                    error = descQuery.error;
                }

                if (error) throw error;

                if (data && data.length > 0) {
                    exibirProduto(data[0]);
                    hideAlert();
                } else {
                    resultCard.classList.add('hidden');
                    showAlert(`Produto não encontrado na base para o código/termo: ${termo}`, 'error');
                }
            } catch (err) {
                console.error("Erro na busca:", err);
                showAlert(`Erro ao consultar o banco: ${err.message || 'Verifique o console'}`, 'error');
            }
        }

        // Renderiza Dados na Tela
        function exibirProduto(item) {
            document.getElementById('res-code').innerText = item[barcodeCol] || item.codigo || 'N/A';
            document.getElementById('res-desc').innerText = item.descricao || item.nome || 'Produto Sem Descrição';
            
            const preco = parseFloat(item.preco || item.preco_venda || 0);
            document.getElementById('res-price').innerText = preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            
            document.getElementById('res-stock').innerText = item.estoque ?? item.quantidade ?? 0;
            document.getElementById('res-client').innerText = item.cliente || item.fornecedor || 'Geral';

            resultCard.classList.remove('hidden');
        }

        // Busca Manual via Formulário
        formManual.addEventListener('submit', (e) => {
            e.preventDefault();
            const termo = inputSearch.value.trim();
            if (termo) buscarProduto(termo);
        });

        // Alertas na Interface
        function showAlert(msg, type) {
            statusAlert.innerText = msg;
            statusAlert.className = "p-3 rounded-lg text-sm text-center font-medium border ";
            
            if (type === 'error') {
                statusAlert.classList.add('bg-red-900/40', 'border-red-700', 'text-red-300');
            } else if (type === 'warning') {
                statusAlert.classList.add('bg-amber-900/40', 'border-amber-700', 'text-amber-300');
            } else if (type === 'success') {
                statusAlert.classList.add('bg-emerald-900/40', 'border-emerald-700', 'text-emerald-300');
            } else {
                statusAlert.classList.add('bg-blue-900/40', 'border-blue-700', 'text-blue-300');
            }
            statusAlert.classList.remove('hidden');
        }

        function hideAlert() {
            statusAlert.classList.add('hidden');
        }

        // Gestão do Modal de Configuração
        btnConfig.addEventListener('click', () => {
            document.getElementById('cfg-url').value = supabaseUrl;
            document.getElementById('cfg-key').value = supabaseKey;
            document.getElementById('cfg-col').value = barcodeCol;
            modalConfig.classList.remove('hidden');
        });

        btnCloseCfg.addEventListener('click', () => modalConfig.classList.add('hidden'));

        btnSaveCfg.addEventListener('click', () => {
            supabaseUrl = document.getElementById('cfg-url').value.trim();
            supabaseKey = document.getElementById('cfg-key').value.trim();
            barcodeCol  = document.getElementById('cfg-col').value.trim() || 'codigo_barras';

            localStorage.setItem('nexxa_sb_url', supabaseUrl);
            localStorage.setItem('nexxa_sb_key', supabaseKey);
            localStorage.setItem('nexxa_sb_col', barcodeCol);

            modalConfig.classList.add('hidden');
            initSupabase();
        });

        // Inicialização
        window.addEventListener('DOMContentLoaded', () => {
            initSupabase();
        });
    </script>
</body>
</html>
