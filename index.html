<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexxa Scanner - Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        #reader video { object-fit: cover !important; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans p-4">
    <div class="max-w-md w-full mx-auto space-y-4">
        <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800 shadow-xl">
            <h1 class="text-base font-bold text-amber-400 mb-3 text-center"><i class="fa-solid fa-barcode mr-2"></i>NEXXA Scanner</h1>
            <div id="reader" class="w-full bg-black rounded-xl overflow-hidden min-h-[200px] flex items-center justify-center mb-3">
                <span class="text-xs text-slate-500">Câmera desativada</span>
            </div>
            <button id="btn-scan" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-xs transition">Escanear Código</button>
        </div>
        <div class="bg-slate-900 rounded-2xl p-3 border border-slate-800">
            <form id="form-manual" class="flex gap-2">
                <input type="text" id="input-search" placeholder="Digite o EAN ou nome..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
                <button type="submit" class="bg-slate-800 text-amber-400 px-3 py-2 rounded-xl text-xs border border-slate-700"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>
        </div>
        <div id="status-alert" class="hidden p-2 rounded-xl text-xs text-center"></div>
        <div id="results-container" class="space-y-4"></div>
    </div>
    <script>
        const SUPABASE_URL = "https://mjkqkyuolsqhtxwzivof.supabase.co";
        const SUPABASE_KEY = "sb_publishable_taL59MpBnTvHmpfD8eMSnw_f2QuR6w-";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let html5QrCode = null, isScanning = false;
        const btnScan = document.getElementById('btn-scan');
        const formManual = document.getElementById('form-manual');
        const inputSearch = document.getElementById('input-search');
        const resultsContainer = document.getElementById('results-container');
        const statusAlert = document.getElementById('status-alert');

        btnScan.addEventListener('click', () => {
            if (isScanning) {
                html5QrCode.stop().then(() => { 
                    isScanning = false; 
                    btnScan.innerText = "Escanear Código"; 
                    btnScan.classList.replace('bg-rose-600', 'bg-amber-500');
                    btnScan.classList.replace('text-white', 'text-slate-950');
                });
            } else {
                html5QrCode = new Html5Qrcode("reader");
                
                // Configurações otimizadas para leitura rápida de códigos EAN/UPC
                const config = { 
                    fps: 15, 
                    qrbox: { width: 280, height: 120 },
                    aspectRatio: 1.777778,
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.UPC_A,
                        Html5QrcodeSupportedFormats.UPC_E,
                        Html5QrcodeSupportedFormats.CODE_128
                    ]
                };

                html5QrCode.start({ facingMode: "environment" }, config, (text) => {
                    html5QrCode.stop().then(() => {
                        isScanning = false; 
                        btnScan.innerText = "Escanear Código";
                        btnScan.classList.replace('bg-rose-600', 'bg-amber-500');
                        btnScan.classList.replace('text-slate-950', 'text-white');
                        buscar(text.trim());
                    });
                }, (errorMessage) => {
                    // Ignora erros contínuos de frame
                }).then(() => { 
                    isScanning = true; 
                    btnScan.innerText = "Parar Câmera"; 
                    btnScan.classList.replace('bg-amber-500', 'bg-rose-600');
                    btnScan.classList.replace('text-slate-950', 'text-white');
                }).catch(err => {
                    alert("Erro ao iniciar câmera: " + err);
                });
            }
        });

        formManual.addEventListener('submit', (e) => {
            e.preventDefault();
            const termo = inputSearch.value.trim();
            if (termo) buscar(termo);
        });

        async function buscar(termo) {
            statusAlert.innerText = `Buscando "${termo}"...`;
            statusAlert.className = "p-2 rounded-xl text-xs text-center bg-slate-900 text-amber-400 border border-slate-800";
            statusAlert.classList.remove('hidden');

            try {
                const { data: cloudData, error } = await supabaseClient.from('nexxa_store').select('*');
                if (error) throw error;

                let produtosMap = {};
                const termoUpper = termo.toUpperCase();

                const regEstoque = cloudData.find(d => d.id === 'estoque' || d.id === 'ESTOQUE');
                if (regEstoque && regEstoque.data) {
                    for (let k in regEstoque.data) {
                        let item = regEstoque.data[k];
                        let ean = item.ean ? String(item.ean).trim() : '';
                        let nome = item.produto ? String(item.produto).trim().toUpperCase() : '';

                        if (!ean || ean === '' || ean === '0') continue;

                        if (ean.includes(termo) || nome.includes(termoUpper)) {
                            let key = ean;
                            if (!produtosMap[key]) produtosMap[key] = { codigo: ean, descricao: item.produto, categoria: item.categoria || 'GERAL' };
                        }
                    }
                }

                const regVendas = cloudData.find(d => d.id === 'vendas');
                if (regVendas && regVendas.data) {
                    regVendas.data.forEach(v => {
                        let ean = v.ean ? String(v.ean).trim() : '';
                        let nome = v.produto ? String(v.produto).trim().toUpperCase() : '';

                        if (!ean || ean === '' || ean === '0') return;

                        if (ean.includes(termo) || nome.includes(termoUpper)) {
                            let key = ean;
                            if (!produtosMap[key]) produtosMap[key] = { codigo: ean, descricao: v.produto, categoria: v.categoria || 'GERAL' };
                        }
                    });
                }

                const lista = Object.values(produtosMap);
                if (lista.length === 0) {
                    statusAlert.innerText = "Nenhum produto com EAN encontrado.";
                    statusAlert.className = "p-2 rounded-xl text-xs text-center bg-rose-950 text-rose-300 border border-rose-800";
                    resultsContainer.innerHTML = "";
                    return;
                }

                statusAlert.classList.add('hidden');
                resultsContainer.innerHTML = "";

                lista.forEach(info => {
                    let clientMap = {}, cdTotal = 0, lojaTotalSum = 0;

                    if (regEstoque && regEstoque.data) {
                        for (let k in regEstoque.data) {
                            let item = regEstoque.data[k];
                            let itemEan = item.ean ? String(item.ean).trim() : '';
                            if (itemEan === info.codigo) {
                                let cliente = (item.cliente || 'Geral').trim();
                                let qtd = Number(item.estoque) || 0;

                                if (cliente.toUpperCase().startsWith('CD')) {
                                    cdTotal += qtd;
                                } else {
                                    if (!clientMap[cliente]) clientMap[cliente] = { estoque: 0, preco: 0 };
                                    clientMap[cliente].estoque += qtd;
                                    lojaTotalSum += qtd;
                                }
                            }
                        }
                    }

                    if (regVendas && regVendas.data) {
                        regVendas.data.forEach(v => {
                            let vEan = v.ean ? String(v.ean).trim() : '';
                            if (vEan === info.codigo) {
                                let cliente = (v.cliente || 'Geral').trim();
                                let preco = parseFloat(v.vlrUnit || 0);
                                if (!clientMap[cliente]) {
                                    clientMap[cliente] = { estoque: 0, preco: preco };
                                } else {
                                    clientMap[cliente].preco = preco;
                                }
                            }
                        });
                    }

                    let estoqueGeralTotal = lojaTotalSum + cdTotal;

                    let lojasHtml = "";
                    Object.keys(clientMap).sort().forEach(cli => {
                        let dados = clientMap[cli];
                        let est = dados.estoque || 0;
                        let prc = dados.preco > 0 ? dados.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : 'R$ 0,00';
                        // Removida a célula do estoque CD das linhas abaixo
                        lojasHtml += `<tr class="border-b border-slate-800"><td class="p-2">${cli}</td><td class="p-2 text-right text-emerald-400">${prc}</td><td class="p-2 text-center font-semibold">${est}</td></tr>`;
                    });

                    let card = document.createElement('div');
                    card.className = "bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-3 shadow-xl";
                    card.innerHTML = `
                        <h2 class="font-bold text-white text-sm">${info.descricao}</h2>
                        <div class="text-[10px] text-amber-400">EAN: ${info.codigo} | Cat: ${info.categoria}</div>
                        <div class="text-[11px] bg-slate-950 p-2 rounded-xl border border-slate-800 flex justify-around text-slate-300 font-mono">
                            <span>Estq. Loja: <strong class="text-white">${lojaTotalSum}</strong></span>
                            <span>Estq. CD: <strong class="text-blue-400">${cdTotal}</strong></span>
                            <span>Total: <strong class="text-amber-400">${estoqueGeralTotal}</strong></span>
                        </div>
                        <table class="w-full text-xs text-left">
                            <tr class="text-slate-400 border-b border-slate-800">
                                <th class="p-2">Loja</th>
                                <th class="p-2 text-right">Preço</th>
                                <th class="p-2 text-center">Estoque Loja</th>
                            </tr>
                            ${lojasHtml || '<tr><td colspan="3" class="p-2 text-center text-slate-500">Sem dados</td></tr>'}
                        </table>
                    `;
                    resultsContainer.appendChild(card);
                });

            } catch (err) {
                statusAlert.innerText = "Erro ao consultar: " + err.message;
                statusAlert.className = "p-2 rounded-xl text-xs text-center bg-rose-950 text-rose-300 border border-rose-800";
            }
        }
    </script>
</body>
</html>
