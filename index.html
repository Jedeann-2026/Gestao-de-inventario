<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AB Conveniencia - Consulta - Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        #reader { position: relative; }
        #reader video { object-fit: cover !important; border-radius: 0.75rem; }
        
        /* Moldura estilo Scanner de Código de Barras */
        .scanner-laser-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 120px;
            border: 2px solid rgba(245, 158, 11, 0.8);
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
            pointer-events: none;
            z-index: 10;
        }

        .scanner-laser-line {
            position: absolute;
            top: 50%;
            left: 5%;
            width: 90%;
            height: 2px;
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
            transform: translateY(-50%);
            animation: pulseLaser 1.5s infinite ease-in-out;
        }

        @keyframes pulseLaser {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans p-4 transition-colors duration-200">

    <!-- TELA DE LOGIN / AUTENTICAÇÃO -->
    <div id="modal-login" class="fixed inset-0 bg-slate-950/90 flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 w-full max-w-sm space-y-5 shadow-2xl transition-colors">
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-500 text-xl mb-1">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-base font-bold text-slate-900 dark:text-white">AB Conveniência - Consulta</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400">Selecione seu perfil e digite a senha para entrar</p>
            </div>

            <form id="form-login" class="space-y-3" onsubmit="fazerLogin(event)">
                <div>
                    <label class="text-[11px] text-slate-500 dark:text-slate-400 block mb-1">Usuário</label>
                    <select id="login-usuario" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-amber-400">
                        <option value="Jedeann">Jedeann</option>
                        <option value="Cristiane">Cristiane</option>
                        <option value="Admin">Admin</option>
                        <option value="Convidado">Convidado</option>
                    </select>
                </div>
                <div>
                    <label class="text-[11px] text-slate-500 dark:text-slate-400 block mb-1">Senha de Acesso</label>
                    <input type="password" id="login-senha" placeholder="Digite sua senha..." class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-amber-400">
                </div>
                <div id="login-erro" class="hidden text-rose-500 text-[11px] text-center font-semibold"></div>
                
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-lg mt-2">
                    Entrar no Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL DA CONSULTA -->
    <div id="app-container" class="max-w-md w-full mx-auto space-y-4">
        <!-- HEADER / SCANNER -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800 shadow-xl transition-colors">
            <div class="flex justify-between items-center mb-3">
                <div>
                    <h1 class="text-base font-bold text-amber-600 dark:text-amber-400 flex items-center gap-2">
                        <i class="fa-solid fa-barcode"></i> AB Conveniencia Consulta
                    </h1>
                    <span id="label-usuario-logado" class="text-[10px] text-slate-400 dark:text-slate-500 block">Usuário: -</span>
                </div>
                <div class="flex items-center gap-2">
                    <!-- BOTÃO SAIR / TROCAR USUÁRIO -->
                    <button onclick="fazerLogout()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-rose-500 hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Sair / Trocar Usuário">
                        <i class="fa-solid fa-right-from-bracket text-sm"></i>
                    </button>
                    <!-- BOTÃO DIA / NOITE -->
                    <button id="btn-theme-toggle" onclick="alternarTema()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-amber-500 hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Alternar Tema Dia/Noite">
                        <i id="theme-icon" class="fa-solid fa-sun text-sm"></i>
                    </button>
                </div>
            </div>

            <div id="reader" class="w-full bg-slate-200 dark:bg-black rounded-xl overflow-hidden min-h-[200px] flex items-center justify-center mb-3 border border-slate-300 dark:border-slate-800">
                <span class="text-xs text-slate-500 dark:text-slate-500">Câmera desativada</span>
            </div>
            <button id="btn-scan" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-xs transition">
                Escanear Código
            </button>
        </div>

        <!-- BUSCA MANUAL E FILTRO DE PERÍODO -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-3 border border-slate-200 dark:border-slate-800 space-y-3 shadow-md transition-colors">
            <form id="form-manual" class="flex gap-2">
                <input type="text" id="input-search" placeholder="Digite o EAN ou nome..." class="flex-1 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-amber-400">
                <button type="submit" class="bg-slate-100 dark:bg-slate-800 text-amber-600 dark:text-amber-400 px-3 py-2 rounded-xl text-xs border border-slate-300 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
            
            <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-200 dark:border-slate-800">
                <div>
                    <label class="block text-[10px] text-slate-500 dark:text-slate-400 mb-1">Data Inicial</label>
                    <input type="date" id="filtro-inicio" onchange="dispararBuscaRecorrente()" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-2 py-1.5 text-[11px] text-slate-900 dark:text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-500 dark:text-slate-400 mb-1">Data Final</label>
                    <input type="date" id="filtro-fim" onchange="dispararBuscaRecorrente()" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-2 py-1.5 text-[11px] text-slate-900 dark:text-white focus:outline-none focus:border-amber-400">
                </div>
            </div>
        </div>

        <div id="status-alert" class="p-2 rounded-xl text-xs text-center bg-white dark:bg-slate-900 text-amber-600 dark:text-amber-400 border border-slate-200 dark:border-slate-800">Carregando dados na memória...</div>
        <div id="results-container" class="space-y-4"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://mjkqkyuolsqhtxwzivof.supabase.co";
        const SUPABASE_KEY = "sb_publishable_taL59MpBnTvHmpfD8eMSnw_f2QuR6w-";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const SENHAS_USUARIOS = {
            "Jedeann": "1234",
            "Cristiane": "1234",
            "Admin": "admin123",
            "Convidado": ""
        };

        let html5QrCode = null, isScanning = false;
        let regEstoque = null, regVendas = null, regEntradasBase = null;
        let isDataLoaded = false;
        let ultimoTermoPesquisado = '';
        let usuarioLogado = localStorage.getItem('nexxa_usuario_logado') || null;

        const modalLogin = document.getElementById('modal-login');
        const loginErro = document.getElementById('login-erro');
        const btnScan = document.getElementById('btn-scan');
        const formManual = document.getElementById('form-manual');
        const inputSearch = document.getElementById('input-search');
        const filtroInicio = document.getElementById('filtro-inicio');
        const filtroFim = document.getElementById('filtro-fim');
        const resultsContainer = document.getElementById('results-container');
        const statusAlert = document.getElementById('status-alert');

        // FUNÇÃO DE LOGIN E CONTROLE DE SESSÃO
        function fazerLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('login-usuario').value;
            const senha = document.getElementById('login-senha').value;

            if (usuario !== "Convidado" && SENHAS_USUARIOS[usuario] !== senha) {
                loginErro.innerText = "Senha incorreta para o usuário " + usuario;
                loginErro.classList.remove('hidden');
                return;
            }

            usuarioLogado = usuario;
            localStorage.setItem('nexxa_usuario_logado', usuario);
            modalLogin.classList.add('hidden');
            
            atualizarLabelUsuario();
        }

        function fazerLogout() {
            if (confirm("Deseja trocar de usuário / sair da sessão?")) {
                localStorage.removeItem('nexxa_usuario_logado');
                usuarioLogado = null;
                document.getElementById('login-senha').value = '';
                loginErro.classList.add('hidden');
                modalLogin.classList.remove('hidden');
                pararCameraTotal();
            }
        }

        function atualizarLabelUsuario() {
            const labelUsuario = document.getElementById('label-usuario-logado');
            if (labelUsuario) labelUsuario.innerText = `Usuário: ${usuarioLogado}`;
        }

        // CONFIGURAÇÃO DOS ÚLTIMOS 7 DIAS (TIRANDO O DIA ATUAL)
        function inicializarFiltroDatas() {
            const hoje = new Date();
            
            const dataFim = new Date(hoje);
            dataFim.setDate(hoje.getDate() - 1); // Ontem
            
            const dataInicio = new Date(dataFim);
            dataInicio.setDate(dataFim.getDate() - 6); // 7 dias atrás

            filtroInicio.value = dataInicio.toISOString().split('T')[0];
            filtroFim.value = dataFim.toISOString().split('T')[0];
        }

        // CONTROLE DE TEMA (CLARO / ESCURO)
        function inicializarTema() {
            const temaSalvo = localStorage.getItem('nexxa_tema');
            if (temaSalvo === 'dark' || (!temaSalvo && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                atualizarIconeTema(true);
            } else {
                document.documentElement.classList.remove('dark');
                atualizarIconeTema(false);
            }
        }

        function alternarTema() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('nexxa_tema', isDark ? 'dark' : 'light');
            atualizarIconeTema(isDark);
        }

        function atualizarIconeTema(isDark) {
            const icon = document.getElementById('theme-icon');
            if (icon) {
                icon.className = isDark ? 'fa-solid fa-sun text-sm' : 'fa-solid fa-moon text-sm';
            }
        }

        async function carregarDadosMemoria() {
            try {
                const { data: cloudData, error } = await supabaseClient.from('nexxa_store').select('*');
                if (error) throw error;

                regEstoque = cloudData.find(d => d.id === 'estoque' || d.id === 'ESTOQUE');
                regVendas = cloudData.find(d => d.id === 'vendas');
                regEntradasBase = cloudData.find(d => d.id === 'entradas');
                isDataLoaded = true;
                
                statusAlert.classList.add('hidden');
            } catch (err) {
                statusAlert.innerText = "Erro ao carregar dados: " + err.message;
                statusAlert.className = "p-2 rounded-xl text-xs text-center bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border border-rose-300 dark:border-rose-800";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            inicializarTema();
            inicializarFiltroDatas();

            if (!usuarioLogado) {
                modalLogin.classList.remove('hidden');
            } else {
                modalLogin.classList.add('hidden');
                atualizarLabelUsuario();
            }

            carregarDadosMemoria();
        });

        function dispararBuscaRecorrente() {
            if (ultimoTermoPesquisado) {
                buscar(ultimoTermoPesquisado, false);
            }
        }

        function obterUltimoPrecoCompra(eanAlvo) {
            if (!regEntradasBase) return 0;

            // Suporta caso regEntradasBase seja um array de objetos ou um objeto único contendo .data
            let listaEntradas = [];
            if (Array.isArray(regEntradasBase)) {
                listaEntradas = regEntradasBase;
            } else if (regEntradasBase.data) {
                if (Array.isArray(regEntradasBase.data)) {
                    listaEntradas = regEntradasBase.data;
                } else if (typeof regEntradasBase.data === 'object') {
                    listaEntradas = Object.values(regEntradasBase.data);
                }
            }

            let ultimaData = 0;
            let ultimoPreco = 0;

            listaEntradas.forEach(nota => {
                // Cada registo de nota pode ser um objeto direto ou conter itens
                let itensNota = [];
                if (nota.itens && Array.isArray(nota.itens)) {
                    itensNota = nota.itens;
                } else if (nota.ean && (nota.precoUnit || nota.custo)) {
                    itensNota = [nota]; // Se a própria nota for o item
                }

                itensNota.forEach(item => {
                    let itemEan = String(item.ean || item.codigo || item.eanProduto || '').trim();
                    if (itemEan === String(eanAlvo).trim()) {
                        let dataNotaStr = nota.data || nota.dataFinalizacao || item.data || '';
                        let dataNota = dataNotaStr ? new Date(dataNotaStr).getTime() : 0;
                        
                        if (dataNota >= ultimaData) {
                            ultimaData = dataNota;
                            let preco = Number(item.precoUnit || item.custo || item.vlrUnit || item.precoCusto || 0);
                            if (preco > 0) {
                                ultimoPreco = preco;
                            }
                        }
                    }
                });
            });

            return ultimoPreco;
        }

        // BOTÃO DE LIGA/DESLIGA DA CÂMARA COM MIRA LASER (OTIMIZADO)
        btnScan.addEventListener('click', async () => {
            if (isScanning) {
                await pararCameraTotal();
            } else {
                await iniciarCameraTotal();
            }
        });

        async function iniciarCameraTotal() {
            const readerElement = document.getElementById('reader');
            readerElement.innerHTML = ''; 

            html5QrCode = new Html5Qrcode("reader");

            const config = { 
                fps: 25, 
                qrbox: { width: 280, height: 120 },
                aspectRatio: 1.777778,
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.CODE_128
                ]
            };

            try {
                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    config, 
                    async (text) => {
                        await pararCameraTotal();
                        inputSearch.value = text.trim();
                        buscar(text.trim());
                    }, 
                    () => {}
                );

                isScanning = true; 
                btnScan.innerText = "Parar Câmera"; 
                btnScan.classList.replace('bg-amber-500', 'bg-rose-600');
                btnScan.classList.replace('text-slate-950', 'text-white');

            } catch (err) {
                console.error("Erro ao iniciar câmara:", err);
                statusAlert.innerText = "Erro na câmara. Verifique as permissões.";
                statusAlert.className = "p-2 rounded-xl text-xs text-center bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border border-rose-300 dark:border-rose-800";
                statusAlert.classList.remove('hidden');
                isScanning = false;
                btnScan.innerText = "Escanear Código";
            }
        }


        async function pararCameraTotal() {
            if (html5QrCode) {
                try {
                    if (html5QrCode.isScanning) {
                        await html5QrCode.stop();
                    }
                    await html5QrCode.clear();
                } catch (e) {
                    console.error("Erro ao limpar câmara:", e);
                }
                html5QrCode = null;
            }
            isScanning = false;
            btnScan.innerText = "Escanear Código";
            btnScan.classList.replace('bg-rose-600', 'bg-amber-500');
            btnScan.classList.replace('text-white', 'text-slate-950');
            
            const readerElement = document.getElementById('reader');
            if (readerElement) {
                readerElement.innerHTML = `<span class="text-xs text-slate-500">Câmera desativada</span>`;
            }
        }

        formManual.addEventListener('submit', (e) => {
            e.preventDefault();
            const termo = inputSearch.value.trim();
            if (termo) buscar(termo);
        });

        function buscar(termo, exibirAlerta = true) {
            ultimoTermoPesquisado = termo;
            if (!isDataLoaded) {
                statusAlert.innerText = "Aguarde, dados ainda sendo carregados...";
                statusAlert.className = "p-2 rounded-xl text-xs text-center bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 border border-amber-300 dark:border-amber-800";
                statusAlert.classList.remove('hidden');
                return;
            }

            if (exibirAlerta) {
                statusAlert.innerText = `Buscando "${termo}"...`;
                statusAlert.className = "p-2 rounded-xl text-xs text-center bg-white dark:bg-slate-900 text-amber-600 dark:text-amber-400 border border-slate-200 dark:border-slate-800";
                statusAlert.classList.remove('hidden');
            }

            let produtosMap = {};
            const termoUpper = termo.toUpperCase();

            // 1. Busca primeiro todos os itens no ESTOQUE (mesmo sem vendas)
            if (regEstoque && regEstoque.data) {
                for (let k in regEstoque.data) {
                    let item = regEstoque.data[k];
                    let ean = item.ean ? String(item.ean).trim() : '';
                    let nome = item.produto ? String(item.produto).trim().toUpperCase() : '';
                    if (!ean || ean === '' || ean === '0') continue;
                    if (ean.includes(termo) || nome.includes(termoUpper)) {
                        if (!produtosMap[ean]) {
                            produtosMap[ean] = { 
                                codigo: ean, 
                                descricao: item.produto, 
                                categoria: item.categoria || 'GERAL', 
                                custo: item.custo || 0,
                                precoVendaCadastro: item.preco || item.precoVenda || 0
                            };
                        }
                    }
                }
            }

            // 2. Complementa com produtos das VENDAS (caso existam)
            if (regVendas && regVendas.data) {
                regVendas.data.forEach(v => {
                    let ean = v.ean ? String(v.ean).trim() : '';
                    let nome = v.produto ? String(v.produto).trim().toUpperCase() : '';
                    if (!ean || ean === '' || ean === '0') return;
                    if (ean.includes(termo) || nome.includes(termoUpper)) {
                        if (!produtosMap[ean]) {
                            produtosMap[ean] = { 
                                codigo: ean, 
                                descricao: v.produto, 
                                categoria: v.categoria || 'GERAL', 
                                custo: 0,
                                precoVendaCadastro: 0
                            };
                        }
                    }
                });
            }

            const lista = Object.values(produtosMap);
            if (lista.length === 0) {
                statusAlert.innerText = "Nenhum produto encontrado.";
                statusAlert.className = "p-2 rounded-xl text-xs text-center bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border border-rose-300 dark:border-rose-800";
                statusAlert.classList.remove('hidden');
                resultsContainer.innerHTML = "";
                return;
            }

            statusAlert.classList.add('hidden');
            resultsContainer.innerHTML = "";

            const dataInicioVal = filtroInicio.value ? new Date(filtroInicio.value + 'T00:00:00') : null;
            const dataFimVal = filtroFim.value ? new Date(filtroFim.value + 'T23:59:59') : null;

            lista.forEach(info => {
                let clientMap = {}, cdTotal = 0, lojaTotalSum = 0;
                let vendasPorLojaMap = {};
                let totalVendidoGeral = 0;
                let qtdVendidaGeral = 0;

                // Processar Estoque por Cliente/Loja
                if (regEstoque && regEstoque.data) {
                    for (let k in regEstoque.data) {
                        let item = regEstoque.data[k];
                        if (String(item.ean).trim() === info.codigo) {
                            let cliente = (item.cliente || 'Geral').trim();
                            let qtd = Number(item.estoque) || 0;
                            let precoCad = Number(item.preco || item.precoVenda) || 0;

                            if (cliente.toUpperCase().startsWith('CD')) {
                                cdTotal += qtd;
                            } else {
                                if (!clientMap[cliente]) clientMap[cliente] = { estoque: 0, preco: precoCad };
                                clientMap[cliente].estoque += qtd;
                                if (precoCad > 0) clientMap[cliente].preco = precoCad;
                                lojaTotalSum += qtd;
                            }
                        }
                    }
                }

                // Processar Vendas no período selecionado
                if (regVendas && regVendas.data) {
                    regVendas.data.forEach(v => {
                        if (String(v.ean).trim() === info.codigo) {
                            let loja = (v.cliente || v.loja || 'Geral').trim();
                            let preco = parseFloat(v.vlrUnit || v.valorUnitario || 0);
                            let qtdV = Number(v.qtd || v.quantidade || 1);

                            if (!clientMap[loja]) {
                                clientMap[loja] = { estoque: 0, preco: 0 };
                            }
                            if (preco > 0) {
                                clientMap[loja].preco = preco;
                            }

                            let dataVendaStr = v.data || v.dataVenda || v.created_at || '';
                            let dentroDoPeriodo = true;
                            if (dataInicioVal || dataFimVal) {
                                if (!dataVendaStr) {
                                    dentroDoPeriodo = false;
                                } else {
                                    let dataVendaObj = new Date(dataVendaStr);
                                    if (isNaN(dataVendaObj)) {
                                        dentroDoPeriodo = false;
                                    } else {
                                        if (dataInicioVal && dataVendaObj < dataInicioVal) dentroDoPeriodo = false;
                                        if (dataFimVal && dataVendaObj > dataFimVal) dentroDoPeriodo = false;
                                    }
                                }
                            }

                            if (dentroDoPeriodo) {
                                let totalLinha = qtdV * preco;
                                totalVendidoGeral += totalLinha;
                                qtdVendidaGeral += qtdV;

                                if (!vendasPorLojaMap[loja]) {
                                    vendasPorLojaMap[loja] = { qtdVenda: 0, totalVenda: 0 };
                                }
                                vendasPorLojaMap[loja].qtdVenda += qtdV;
                                vendasPorLojaMap[loja].totalVenda += totalLinha;
                            }
                        }
                    });
                }

                let estoqueGeralTotal = lojaTotalSum + cdTotal;
                let ultimoPrecoCompra = obterUltimoPrecoCompra(info.codigo);

                let me_custo = ultimoPrecoCompra > 0 ? ultimoPrecoCompra : (info.custo || 0);
                let ultimoPrecoHtml = `
                    <div class="flex justify-between font-mono text-cyan-600 dark:text-cyan-400 pt-1 border-t border-emerald-200 dark:border-emerald-900/40 text-xs">
                        <span>Último Preço Custo:</span>
                        <strong>${Number(me_custo).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong>
                    </div>
                `;

                let todasLojasSet = new Set([...Object.keys(clientMap), ...Object.keys(vendasPorLojaMap)]);

                let detalhesLojaHtml = "";

                if (todasLojasSet.size === 0) {
                    let prcExibicao = info.precoVendaCadastro > 0 
                        ? Number(info.precoVendaCadastro).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) 
                        : 'Sem registro';

                    detalhesLojaHtml = `
                        <tr class="border-b border-slate-200 dark:border-slate-900 text-[11px]">
                            <td class="p-1.5 font-medium text-slate-800 dark:text-slate-200">Geral / Estoque Direto</td>
                            <td class="p-1.5 text-right font-semibold text-emerald-600 dark:text-emerald-400">${prcExibicao}</td>
                            <td class="p-1.5 text-center text-amber-600 dark:text-amber-400 font-semibold">${estoqueGeralTotal}</td>
                            <td class="p-1.5 text-center text-slate-900 dark:text-white font-bold">0 un</td>
                            <td class="p-1.5 text-right text-emerald-600 dark:text-emerald-400 font-medium">R$ 0,00</td>
                        </tr>`;
                } else {
                    Array.from(todasLojasSet).sort().forEach(loja => {
                        let dadosLoja = clientMap[loja] || { estoque: 0, preco: 0 };
                        let estLoja = dadosLoja.estoque || 0;
                        let prcLoja = dadosLoja.preco > 0 
                            ? dadosLoja.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) 
                            : (info.precoVendaCadastro > 0 ? Number(info.precoVendaCadastro).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : 'Sem registro');
                        
                        let vendaInfo = vendasPorLojaMap[loja] || { qtdVenda: 0, totalVenda: 0 };
                        let totStr = vendaInfo.totalVenda.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                        detalhesLojaHtml += `
                            <tr class="border-b border-slate-200 dark:border-slate-900 text-[11px]">
                                <td class="p-1.5 font-medium text-slate-800 dark:text-slate-200">${loja}</td>
                                <td class="p-1.5 text-right font-semibold text-emerald-600 dark:text-emerald-400">${prcLoja}</td>
                                <td class="p-1.5 text-center text-amber-600 dark:text-amber-400 font-semibold">${estLoja}</td>
                                <td class="p-1.5 text-center text-slate-900 dark:text-white font-bold">${vendaInfo.qtdVenda} un</td>
                                <td class="p-1.5 text-right text-emerald-600 dark:text-emerald-400 font-medium">${totStr}</td>
                            </tr>`;
                    });
                }

                // URL da imagem no Supabase Storage e Fallback
                const urlImagem = `https://mjkqkyuolsqhtxwzivof.supabase.co/storage/v1/object/public/produtos-imagens/${info.codigo}.jpg`;
                const imgFallback = "https://via.placeholder.com/80?text=Sem+Foto";

                let card = document.createElement('div');
                card.className = "bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800 space-y-3 shadow-xl transition-colors";
                card.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <img src="${urlImagem}" 
                             onerror="this.onerror=null; this.src='${imgFallback}';" 
                             alt="${info.descricao}" 
                             class="w-14 h-14 object-cover rounded-xl border border-slate-200 dark:border-slate-800 shrink-0 bg-slate-100 dark:bg-slate-950">
                        
                        <div class="space-y-1 min-w-0 flex-1">
                            <span class="text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700">${info.categoria}</span>
                            <h2 class="font-bold text-slate-900 dark:text-white text-sm leading-snug truncate">${info.descricao}</h2>
                            <div class="text-[10px] text-amber-600 dark:text-amber-400 font-mono">EAN: ${info.codigo}</div>
                        </div>
                    </div>
                    
                    <div class="text-[11px] bg-slate-50 dark:bg-slate-950 p-2 rounded-xl border border-slate-200 dark:border-slate-800 flex justify-around text-slate-600 dark:text-slate-300 font-mono">
                        <span>Estq. Loja: <strong class="text-slate-900 dark:text-white">${lojaTotalSum}</strong></span>
                        <span>Estq. CD: <strong class="text-blue-600 dark:text-blue-400">${cdTotal}</strong></span>
                        <span>Total: <strong class="text-amber-600 dark:text-amber-400">${estoqueGeralTotal}</strong></span>
                    </div>

                    <!-- Totalizador de Vendas e Preço de Custo no Período -->
                    <div class="bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900/60 p-2.5 rounded-xl text-xs space-y-1">
                        <div class="text-[10px] text-emerald-700 dark:text-emerald-400 font-bold uppercase"><i class="fa-solid fa-chart-pie mr-1"></i> Resumo de Vendas (Período)</div>
                        <div class="flex justify-between font-mono">
                            <span>Qtd Vendida: <strong class="text-slate-900 dark:text-white">${qtdVendidaGeral} un</strong></span>
                            <span>Total Faturado: <strong class="text-emerald-600 dark:text-emerald-400">${totalVendidoGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong></span>
                        </div>
                        ${ultimoPrecoHtml}
                    </div>

                    <!-- Detalhado por Loja (Preço, Estoque e Vendas) -->
                    <div class="space-y-1">
                        <div class="text-[11px] font-semibold text-slate-700 dark:text-slate-300"><i class="fa-solid fa-store mr-1"></i> Detalhes por Loja</div>
                        <div class="max-h-44 overflow-y-auto border border-slate-200 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950">
                            <table class="w-full text-xs text-left">
                                <thead class="text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-900/50 sticky top-0">
                                    <tr>
                                        <th class="p-1.5 text-[10px]">Loja</th>
                                        <th class="p-1.5 text-[10px] text-right">Preço Venda</th>
                                        <th class="p-1.5 text-[10px] text-center">Estq.</th>
                                        <th class="p-1.5 text-[10px] text-center">Vendas</th>
                                        <th class="p-1.5 text-[10px] text-right">Faturado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${detalhesLojaHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
