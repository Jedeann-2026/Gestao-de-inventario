<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexxa Scanner - Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        #reader video { object-fit: cover !important; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans p-4">
    <div class="max-w-md w-full mx-auto space-y-4">
        <!-- Scanner -->
        <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800 shadow-xl">
            <h1 class="text-base font-bold text-amber-400 mb-3 text-center"><i class="fa-solid fa-barcode mr-2"></i>NEXXA Scanner</h1>
            <div id="reader" class="w-full bg-black rounded-xl overflow-hidden min-h-[200px] flex items-center justify-center mb-3">
                <span class="text-xs text-slate-500">Câmera desativada</span>
            </div>
            <button id="btn-scan" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-xs transition">Escanear Código</button>
        </div>

        <!-- Pesquisa e Filtro de Período -->
        <div class="bg-slate-900 rounded-2xl p-3 border border-slate-800 space-y-3">
            <form id="form-manual" class="flex gap-2">
                <input type="text" id="input-search" placeholder="Digite o EAN ou nome..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
                <button type="submit" class="bg-slate-800 text-amber-400 px-3 py-2 rounded-xl text-xs border border-slate-700"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>
            
            <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-800">
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Data Inicial</label>
                    <input type="date" id="filtro-inicio" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-[11px] text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Data Final</label>
                    <input type="date" id="filtro-fim" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-[11px] text-white focus:outline-none focus:border-amber-400">
                </div>
            </div>
        </div>

        <div id="status-alert" class="p-2 rounded-xl text-xs text-center bg-slate-900 text-amber-400 border border-slate-800">Carregando dados na memória...</div>
        <div id="results-container" class="space-y-4"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://mjkqkyuolsqhtxwzivof.supabase.co";
        const SUPABASE_KEY = "sb_publishable_taL59MpBnTvHmpfD8eMSnw_f2QuR6w-";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let html5QrCode = null, isScanning = false;
        let regEstoque = null, regVendas = null;
        let isDataLoaded = false;

        const btnScan = document.getElementById('btn-scan');
        const formManual = document.getElementById('form-manual');
        const inputSearch = document.getElementById('input-search');
        const filtroInicio = document.getElementById('filtro-inicio');
        const filtroFim = document.getElementById('filtro-fim');
        const resultsContainer = document.getElementById('results-container');
        const statusAlert = document.getElementById('status-alert');

        async function carregarDadosMemoria() {
            try {
                const { data: cloudData, error } = await supabaseClient.from('nexxa_store').select('*');
                if (error) throw error;

                regEstoque = cloudData.find(d => d.id === 'estoque' || d.id === 'ESTOQUE');
                regVendas = cloudData.find(d => d.id === 'vendas');
                isDataLoaded = true;
                
                statusAlert.classList.add('hidden');
            } catch (err) {
                statusAlert.innerText = "Erro ao carregar dados: " + err.message;
                statusAlert.className = "p-2 rounded-xl text-xs text-center bg-rose-950 text-rose-300 border border-rose-800";
            }
        }

        window.addEventListener('DOMContentLoaded', carregarDadosMemoria);

        btnScan.addEventListener('click', () => {
            if (isScanning) {
                pararCamera();
            } else {
                iniciarCamera();
            }
        });

        function iniciarCamera() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = { 
                fps: 20, 
                qrbox: { width: 280, height: 120 },
                aspectRatio: 1.777778,
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.CODE_128
                ]
            };

            html5QrCode.start({ facingMode: "environment" }, config, (text) => {
                pararCamera();
                inputSearch.value = text.trim();
                buscar(text.trim());
            }, () => {}).then(() => { 
                isScanning = true; 
                btnScan.innerText = "Parar Câmera"; 
                btnScan.classList.replace('bg-amber-500', 'bg-rose-600');
                btnScan.classList.replace('text-slate-950', 'text-white');
            }).catch(err => {
                statusAlert.innerText = "Erro na câmara. Verifique as permissões.";
                statusAlert.className = "p-2 rounded-xl text-xs text-center bg-rose-950 text-rose-300 border border-rose-800";
                statusAlert.classList.remove('hidden');
                isScanning = false;
            });
        }

        function pararCamera() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false; 
                    btnScan.innerText = "Escanear Código"; 
                    btnScan.classList.replace('bg-rose-600', 'bg-amber-500');
                    btnScan.classList.replace('text-white', 'text-slate-950');
                }).catch(() => {
                    isScanning = false;
                    btnScan.innerText = "Escanear Código";
                });
            }
        }

        formManual.addEventListener('submit', (e) => {
            e.preventDefault();
            const termo = inputSearch.value.trim();
            if (termo) buscar(termo);
        });

        function buscar(termo) {
            if (!isDataLoaded) {
                statusAlert.innerText = "Aguarde, dados ainda sendo carregados...";
                statusAlert.className = "p-2 rounded-xl text-xs text-center bg-amber-950 text-amber-300 border border-amber-800";
                statusAlert.classList.remove('hidden');
                return;
            }

            let produtosMap = {};
            const termoUpper = termo.toUpperCase();

            if (regEstoque && regEstoque.data) {
                for (let k in regEstoque.data) {
                    let item = regEstoque.data[k];
                    let ean = item.ean ? String(item.ean).trim() : '';
                    let nome = item.produto ? String(item.produto).trim().toUpperCase() : '';
                    if (!ean || ean === '' || ean === '0') continue;
                    if (ean.includes(termo) || nome.includes(termoUpper)) {
                        if (!produtosMap[ean]) produtosMap[ean] = { codigo: ean, descricao: item.produto, categoria: item.categoria || 'GERAL' };
                    }
                }
            }

            if (regVendas && regVendas.data) {
                regVendas.data.forEach(v => {
                    let ean = v.ean ? String(v.ean).trim() : '';
                    let nome = v.produto ? String(v.produto).trim().toUpperCase() : '';
                    if (!ean || ean === '' || ean === '0') return;
                    if (ean.includes(termo) || nome.includes(termoUpper)) {
                        if (!produtosMap[ean]) produtosMap[ean] = { codigo: ean, descricao: v.produto, categoria: v.categoria || 'GERAL' };
                    }
                });
            }

            const lista = Object.values(produtosMap);
            if (lista.length === 0) {
                statusAlert.innerText = "Nenhum produto encontrado.";
                statusAlert.className = "p-2 rounded-xl text-xs text-center bg-rose-950 text-rose-300 border border-rose-800";
                statusAlert.classList.remove('hidden');
                resultsContainer.innerHTML = "";
                return;
            }

            statusAlert.classList.add('hidden');
            resultsContainer.innerHTML = "";

            const dataInicioVal = filtroInicio.value ? new Date(filtroInicio.value + 'T00:00:00') : null;
            const dataFimVal = filtroFim.value ? new Date(filtroFim.value + 'T23:59:59') : null;

            lista.forEach(info => {
                let clientEstoqueMap = {}, cdTotal = 0, lojaTotalSum = 0;
                let vendasPorLojaMap = {};
                let totalVendidoGeral = 0;
                let qtdVendidaGeral = 0;

                // Processar Estoque
                if (regEstoque && regEstoque.data) {
                    for (let k in regEstoque.data) {
                        let item = regEstoque.data[k];
                        if (String(item.ean).trim() === info.codigo) {
                            let cliente = (item.cliente || 'Geral').trim();
                            let qtd = Number(item.estoque) || 0;
                            if (cliente.toUpperCase().startsWith('CD')) {
                                cdTotal += qtd;
                            } else {
                                if (!clientEstoqueMap[cliente]) clientEstoqueMap[cliente] = 0;
                                clientEstoqueMap[cliente] += qtd;
                                lojaTotalSum += qtd;
                            }
                        }
                    }
                }

                // Processar Vendas com Filtro de Período e Agrupamento por Loja
                if (regVendas && regVendas.data) {
                    regVendas.data.forEach(v => {
                        if (String(v.ean).trim() === info.codigo) {
                            let dataVendaStr = v.data || v.dataVenda || v.created_at || '';
                            if (dataInicioVal || dataFimVal) {
                                if (!dataVendaStr) return;
                                let dataVendaObj = new Date(dataVendaStr);
                                if (isNaN(dataVendaObj)) return;
                                if (dataInicioVal && dataVendaObj < dataInicioVal) return;
                                if (dataFimVal && dataVendaObj > dataFimVal) return;
                            }

                            let loja = (v.cliente || v.loja || 'Geral').trim();
                            let qtdV = Number(v.qtd || v.quantidade || 1);
                            let vlrU = parseFloat(v.vlrUnit || v.valorUnitario || 0);
                            let totalLinha = qtdV * vlrU;

                            totalVendidoGeral += totalLinha;
                            qtdVendidaGeral += qtdV;

                            if (!vendasPorLojaMap[loja]) {
                                vendasPorLojaMap[loja] = { qtdVenda: 0, totalVenda: 0 };
                            }
                            vendasPorLojaMap[loja].qtdVenda += qtdV;
                            vendasPorLojaMap[loja].totalVenda += totalLinha;
                        }
                    });
                }

                let estoqueGeralTotal = lojaTotalSum + cdTotal;

                // Unificar todas as lojas presentes tanto no estoque quanto nas vendas para a tabela detalhada
                let todasLojasSet = new Set([...Object.keys(clientEstoqueMap), ...Object.keys(vendasPorLojaMap)]);

                let detalhesLojaHtml = "";
                Array.from(todasLojasSet).sort().forEach(loja => {
                    let estLoja = clientEstoqueMap[loja] || 0;
                    let vendaInfo = vendasPorLojaMap[loja] || { qtdVenda: 0, totalVenda: 0 };
                    let totStr = vendaInfo.totalVenda.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                    detalhesLojaHtml += `
                        <tr class="border-b border-slate-900 text-[11px]">
                            <td class="p-1.5 font-medium">${loja}</td>
                            <td class="p-1.5 text-center text-amber-400 font-semibold">${estLoja}</td>
                            <td class="p-1.5 text-center">${vendaInfo.qtdVenda}</td>
                            <td class="p-1.5 text-right text-emerald-400 font-medium">${totStr}</td>
                        </tr>`;
                });

                let card = document.createElement('div');
                card.className = "bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-3 shadow-xl";
                card.innerHTML = `
                    <h2 class="font-bold text-white text-sm">${info.descricao}</h2>
                    <div class="text-[10px] text-amber-400">EAN: ${info.codigo} | Cat: ${info.categoria}</div>
                    
                    <div class="text-[11px] bg-slate-950 p-2 rounded-xl border border-slate-800 flex justify-around text-slate-300 font-mono">
                        <span>Estq. Loja: <strong class="text-white">${lojaTotalSum}</strong></span>
                        <span>Estq. CD: <strong class="text-blue-400">${cdTotal}</strong></span>
                        <span>Total: <strong class="text-amber-400">${estoqueGeralTotal}</strong></span>
                    </div>

                    <!-- Totalizador de Vendas no Período -->
                    <div class="bg-emerald-950/40 border border-emerald-900/60 p-2.5 rounded-xl text-xs space-y-1">
                        <div class="text-[10px] text-emerald-400 font-bold uppercase"><i class="fa-solid fa-chart-pie mr-1"></i> Resumo de Vendas (Período)</div>
                        <div class="flex justify-between font-mono">
                            <span>Qtd Vendida: <strong class="text-white">${qtdVendidaGeral} un</strong></span>
                            <span>Total Faturado: <strong class="text-emerald-400">${totalVendidoGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong></span>
                        </div>
                    </div>

                    <!-- Detalhado por Loja (Estoque e Vendas) -->
                    <div class="space-y-1">
                        <div class="text-[11px] font-semibold text-slate-300"><i class="fa-solid fa-store mr-1"></i> Detalhes por Loja</div>
                        <div class="max-h-44 overflow-y-auto border border-slate-800 rounded-xl bg-slate-950">
                            <table class="w-full text-xs text-left">
                                <thead class="text-slate-400 border-b border-slate-800 bg-slate-900/50 sticky top-0">
                                    <tr>
                                        <th class="p-1.5 text-[10px]">Loja</th>
                                        <th class="p-1.5 text-[10px] text-center">Estq. Loja</th>
                                        <th class="p-1.5 text-[10px] text-center">Qtd Venda</th>
                                        <th class="p-1.5 text-[10px] text-right">Total Faturado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${detalhesLojaHtml || '<tr><td colspan="4" class="p-3 text-center text-slate-500">Nenhum dado encontrado</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
